<!-- projects-app.html 项目应用根组件：卡片网格列表 + 详情视图（二级项目按同一 mount 契约嵌套） -->
<template component>
  <div class="relative hfull wfull overflow-y-auto bg-theme-bg">
    <!-- 列表视图：卡片网格 -->
    <x-if :value="store.view === 'list'">
      <x-if :value="store.menus?.length">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x20px gap-y24px p24px max-w1400px mxauto"
        >
          <x-fill :value="store.menus">
            <div
              on:click="$host.openProject($data)"
              class="cursor-pointer b b-theme-border b-solid rounded-8px overflow-hidden flex flex-col bg-theme-bg transition-all hover:shadow-lg hover:translate-y-[-4px]"
            >
              <!-- 有封面 -->
              <x-if :value="$data.cover">
                <img
                  attr:src="$host.getProjectUrl($data.name, $data.cover)"
                  :alt="$data.title"
                  loading="lazy"
                  class="wfull aspect-16/10 [object-fit:cover] bg-theme-hover"
                />
              </x-if>
              <!-- 无封面：渐变占位，显示标题首字（presetMini v66 无渐变规则，用任意值） -->
              <x-if :value="!$data.cover">
                <div
                  class="wfull aspect-16/10 flex-center text-40px text-white font700 bg-[linear-gradient(to_bottom_right,#4f8cf7,#8b5cf6)]"
                >
                  {{$data.title[0]}}
                </div>
              </x-if>
              <div class="p12px pt10px flex-1 flex flex-col gap-y4px">
                <p class="m0 truncate text-16px font600 text-theme-text">
                  {{$data.title}}
                </p>
                <p class="m0 line-clamp-2 text-12px text-blueGray">
                  {{$data.description}}
                </p>
              </div>
            </div>
          </x-fill>
        </div>
      </x-if>
      <x-if :value="!store.menus?.length">
        <div class="hfull flex-center text-14px text-blueGray">
          暂无项目，在 projects/ 下新建目录并运行 pnpm menu
        </div>
      </x-if>
    </x-if>
    <!-- 详情视图：工具条 + 二级项目挂载点 -->
    <x-if :value="store.view === 'detail'">
      <div class="relative hfull wfull flex flex-col">
        <div
          class="flex-between h44px flex-shrink-0 px16px b-b b-b-solid b-b-theme-hover"
        >
          <button
            class="l-btn flex-center gap-x4px text-14px"
            on:click="showList"
          >
            <i class="i-mdi:arrow-left"></i>
            项目列表
          </button>
          <span class="text-16px font600 text-theme-text">{{pageTitle}}</span>
          <a
            class="l-btn text-12px text-blueGray no-underline"
            target="_blank"
            attr:href="getStandaloneUrl()"
          >
            <i class="i-mdi:open-in-new"></i> 独立页打开
          </a>
        </div>
        <div class="flex-1 relative overflow-hidden">
          <x-if :value="subLoading">
            <div class="dj-loading-mask"><span class="dj-spinner"></span></div>
          </x-if>
          <div class="project-sub relative hfull wfull"></div>
        </div>
      </div>
    </x-if>
  </div>

  <script type="module">
    import { getUrl } from "../../../src/js/util.js";
    import { createCtx, getCtxById } from "../../../src/micro/context.js";

    export default async ({ load }) => {
      const { store } = await load("../store.js");
      return {
        data: {
          store,
          pageTitle: "",
          subLoading: false,
        },
        attached() {
          // 深链 #/projects/<name>：ctx.sub 决定直接进入详情
          const sub = this.appCtx()?.sub;
          if (sub) this.showDetail(sub);
        },
        detached() {
          this.__subUnmount?.();
          this.__subUnmount = null;
          this.store = null;
        },
        proto: {
          /** 上下文经 data-ctx-id 查注册表（ofa 会丢元素上的外部对象属性） */
          appCtx() {
            return getCtxById(this.ele?.getAttribute?.("data-ctx-id"));
          },
          getProjectUrl(name, file) {
            return getUrl(`projects/${name}/${file || "index.html"}`);
          },
          getStandaloneUrl() {
            return getUrl(`projects/${this.store.sub}/index.html`);
          },
          /** 点击卡片：内嵌改壳路由（可前进后退），独立则内部切视图 */
          openProject(data) {
            const ctx = this.appCtx();
            if (ctx?.embedded) {
              ctx.navigate(`#/projects/${data.name}`);
              return;
            }
            this.showDetail(data.name);
          },
          showDetail(name) {
            const menu = this.store.menus.find((m) => m.name === name);
            this.store.sub = name;
            this.pageTitle = menu?.title || name;
            this.store.view = "detail";
            this.subLoading = true;
            this.mountSub(name).catch((e) => console.error(e));
          },
          showList() {
            this.__subUnmount?.();
            this.__subUnmount = null;
            this.subLoading = false;
            const ctx = this.appCtx();
            if (ctx?.embedded) {
              ctx.back("#/projects");
              return;
            }
            this.store.sub = "";
            this.store.view = "list";
          },
          /** 按统一契约挂载二级项目：projects/<name>/index.js 的 mount */
          async mountSub(name) {
            try {
              const container = await this.waitSubContainer();
              const mod = await import(getUrl(`projects/${name}/index.js`));
              const childCtx = createCtx({
                name: "projects",
                sub: name,
                embedded: this.appCtx()?.embedded ?? false,
              });
              childCtx.back = () => this.showList();
              this.__subUnmount = await mod.mount(container, childCtx);
              // 二级项目挂载完成后更新就绪信号（宿主 ready 早于这里）
              document.body.setAttribute("data-app-ready", `projects/${name}`);
            } finally {
              this.subLoading = false;
            }
          },
          async waitSubContainer() {
            for (let i = 0; i < 40; i++) {
              const el = this.shadow?.ele?.querySelector(".project-sub");
              if (el) {
                el.replaceChildren();
                return el;
              }
              // 用定时器而非 rAF：无头虚拟时间下 rAF 不可靠
              await new Promise((r) => setTimeout(r, 50));
            }
            throw new Error("项目详情容器未就绪");
          },
        },
      };
    };
  </script>
</template>
