<!-- mdbook-app.html 文档应用根组件：菜单 + 搜索 + md 渲染 + PDF 导出（自 src/pages/mdbook.html 移植） -->
<template component>
  <link rel="stylesheet" href="../../../src/css/uno.css?v=0.3.0" />
  <link rel="stylesheet" href="../../../src/css/uno-icon.css?v=0.3.0" />
  <link rel="stylesheet" href="../../../src/css/highlightjs.css?v=0.3.0" />

  <l-m src="../../../src/component/common/l-button.html"></l-m>
  <l-m src="./mdbook-menu.html"></l-m>
  <l-m src="./mdbook-search.html"></l-m>

  <div class="flex hfull bg-theme-bg">
    <mdbook-menu
      :menus="store.menus"
      :title="store.title"
      on:toggle="selectDoc"
    ></mdbook-menu>
    <div class="flex-1 flex flex-col relative overflow-hidden min-w-0">
      <!-- 内容区工具条：搜索 + 当前文档标题 + PDF 按钮 -->
      <div
        class="flex-between h44px px16px b-b b-b-solid b-b-theme-hover flex-shrink-0 gap-x12px"
      >
        <mdbook-search
          :menus="store.menus"
          :suffix="'.md'"
          on:select="selectDoc"
        ></mdbook-search>
        <span class="text-14px text-blueGray truncate">{{pageTitle}}</span>
        <l-button
          title="下载文档为PDF"
          :icon="'i-tabler:pdf'"
          on:on-click="getPdf"
          :loading="pdfLoading"
        >
        </l-button>
      </div>
      <div
        attr:class="`md ${theme} flex-1 relative overflow-y-auto`"
      >
        <x-if :value="loading">
          <div
            class="absolute z99 top-0 left-0 wfull hfull bg-theme-bg flex-center"
          >
            <i class="i-eos-icons:bubble-loading w40px h40px text-#3498db"></i>
          </div>
        </x-if>
        <div id="pdf" class="bg-theme-bg relative max-w794px min-w595px mxauto">
          <h1 class="text-center tracking-2px">{{pageTitle}}</h1>
          <div :html="mdTxt" id="md" class="px40px all:transition-200"></div>
        </div>
        <div class="h40px"></div>
      </div>
    </div>
  </div>

  <script>
    import { Marked } from "https://esm.sh/marked@14.1.3";
    import { markedHighlight } from "https://esm.sh/marked-highlight@2.2.0";
    import hljs from "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/es/highlight.min.js";
    import { jsPDF } from "https://esm.sh/jspdf@2.5.2";
    import html2canvas from "https://esm.sh/html2canvas@1.4.1";

    export default async ({ load }) => {
      const {
        imgClipByPage,
        checkImgEmptyLine,
        colorDistance,
      } = await load("../js/pdf.js");
      const { watchHtmlTheme } = await load("../../../src/js/util.js");
      const { store, setTitle, setMdContent, stripSuffix, getContent } =
        await load("../store.js");

      let marked = null;
      let tim = null;
      return {
        data: {
          mdTxt: "加载中。。。",
          store: {},
          currentTitle: "",
          pdfLoading: false,
          pageTitle: "",
          theme: "light",
          loading: false,
          observer: null,
        },
        watch: {
          // 深度 watch（如 "store.title"）不会跟随 attached 里替换的外部 store，
          // 用组件自有的 currentTitle 桥接（见 attached 的 stanz watch 订阅）
          async currentTitle(title) {
            // 菜单/搜索选中新文档时重新加载（初始渲染由 attached 处理，避免重复加载）
            if (!title || title === this.__renderedTitle) return;
            this.loadDoc(title);
          },
        },
        ready() {
          this.shadow.on("click", this.copyCode);
        },
        detached() {
          if (this.__titleWatchId) {
            store.unwatch(this.__titleWatchId);
            this.__titleWatchId = null;
          }
          this.store = null;
          this.shadow.off("click", this.copyCode);
          this.observer && this.observer();
          this.observer = null;
        },
        attached() {
          this.observer = watchHtmlTheme((theme) => {
            this.theme = theme;
          });
          // 模板绑定走原对象（attached 赋值保留引用，data 定义会被包装成副本）；
          // title 变化经 stanz 原生 watch 桥接到组件自有 data
          this.store = store;
          this.currentTitle = store.title;
          this.__titleWatchId = store.watch((e) => {
            if (e.type === "set" && e.name === "title") {
              this.currentTitle = e.value;
            }
          });
          marked = new Marked(
            markedHighlight({
              emptyLangClass: "hljs",
              langPrefix: "hljs language-",
              highlight(code, lang, info) {
                const language = hljs.getLanguage(lang) ? lang : "plaintext";
                const value = hljs.highlight(code, { language }).value;
                // 把特殊字符 比如 < 转义一下
                const _code = encodeURI(code);
                const _value = `<div class="cus-title"><span>${language}</span><button data-code="${_code}" class="copy-btn">复制</button></div>${value}`;
                return _value;
              },
            })
          );

          setTimeout(async () => {
            const cachedTitle = store.title;
            // currentTitle watch 可能已触发过加载，去重
            if (!cachedTitle || this.__renderedTitle === cachedTitle) return;
            this.loadDoc(cachedTitle);
          }, 100);
        },
        proto: {
          getTitle: stripSuffix,
          selectDoc({ data }) {

            if (data) setTitle(data);
          },
          /** 加载并渲染文档 */
          async loadDoc(title) {
            this.__renderedTitle = title;
            this.pageTitle = stripSuffix(title);
            // 缓存优先：缓存内容与其所属标题（mdTitle）一起保存，标题一致才有效
            if (store.mdContent && store.mdTitle === title) {
              this.renderMd(store.mdContent);
              return;
            }
            this.loading = true;
            const content = await getContent();
            setMdContent(content);
            this.renderMd(content);
            this.loading = false;
            this.scrollToTop();
          },
          copyCode(e) {
            const color = "text-#18a058";
            let el = e.target;

            const isButton = (_el) =>
              _el.tagName === "BUTTON" && _el.className.includes("copy-btn");

            if (!isButton(el)) return;

            const code = decodeURI(el.dataset.code);
            if (tim) {
              clearTimeout(tim);
              tim = null;
            }

            navigator.clipboard.writeText(code).then(() => {
              el.textContent = "已复制";
              el.classList.toggle(color);

              tim = setTimeout(() => {
                el.textContent = "复制";
                el.classList.toggle(color);
                tim = null;
              }, 2000);
            });
          },
          // 滚动到顶
          scrollToTop() {
            const ele = this.shadow.ele;
            const mdDom = ele.querySelector(".md");
            mdDom.scrollTo({ top: 0, behavior: "smooth" });
          },
          /** 渲染md */
          renderMd(mdTxt) {
            this.mdTxt = marked.parse(mdTxt);
          },
          /** 向上寻找最近的空行 */
          findNearestEmptyLine(canvas, ctx, findY, pageOffset) {
            const step = 4; // 向上搜索的步长
            let currentY = findY;
            while (currentY >= 0) {
              const isEmpty = checkImgEmptyLine(canvas, ctx, pageOffset + currentY);
              if (isEmpty) {
                return currentY;
              }
              currentY -= step;
            }
            return currentY;
          },
          /** 下载PDF */
          getPdf() {
            let ele = this.shadow.ele;
            let mdDom = ele.querySelector("#pdf");
            let doc = new jsPDF({
              orientation: "p", // 纵向（portrait）或横向（landscape）
              unit: "pt", // 单位：pt、mm、cm、in
              format: "a4", // 纸张格式：a4、a3、letter 等
            });

            this.pdfLoading = true;

            html2canvas(mdDom).then(async (canvas) => {
              const ctx = canvas.getContext("2d", { willReadFrequently: true });
              /** 图片宽度 */
              const cW = canvas.width;
              /** 图片高度 */
              const cH = canvas.height;

              const marginTop = 30;
              /** pdf 一页的页面宽度 */
              const pdfPageW = doc.internal.pageSize.getWidth();
              /** pdf 一页的页面高度 */
              const pdfPageH = doc.internal.pageSize.getHeight();

              /** pdf 页面总高度, 根据宽度比利缩放高度 */
              const pdfPageTotalH = pdfPageW * (cH / cW);

              const heightRatio = pdfPageTotalH / cH;

              let y = 0;
              let page = 0;
              while (y < pdfPageTotalH) {
                y > 0 && doc.addPage();
                let pageContentHeight = pdfPageH - marginTop * 2;
                const ratio = pageContentHeight / pdfPageTotalH;
                // 图片一个页面实际高度
                let imgHeight = cH * ratio;
                // 找到适合的图片高度
                const pageOffset = y / heightRatio;
                const emptyHeight = this.findNearestEmptyLine(
                  canvas,
                  ctx,
                  imgHeight,
                  pageOffset
                );

                if (Math.round(emptyHeight) !== Math.round(imgHeight)) {
                  // 图片高度减去 找到的适合的图片高度 就是 需要去除的高度 图片实际高度
                  const diff = imgHeight - emptyHeight;
                  // 图片实际高度 和 PDF 高度不一样，需要转换一下
                  const pageDiff = pdfPageTotalH / cH;

                  imgHeight = emptyHeight;

                  const diffHeight = diff * pageDiff;

                  pageContentHeight = pageContentHeight - diffHeight;
                }
                // 最后一页可能有空白
                let _imgHeight = imgHeight;
                const _y = y / heightRatio;
                if (_y + imgHeight > canvas.height) {
                  _imgHeight = canvas.height - _y;
                }

                const { base64 } = await imgClipByPage(canvas, _y, _imgHeight);

                // PDF底部颜色跟随主题色
                const color = this.theme === "dark" ? "#222" : "#fff";
                doc.setFillColor(color);
                doc.rect(0, 0, pdfPageW, pdfPageH, "F"); // "F" 表示填充

                doc.addImage(
                  base64,
                  "JPEG",
                  0,
                  marginTop,
                  pdfPageW,
                  // 最后一页的空白处理
                  _imgHeight * heightRatio
                );
                y += pageContentHeight;
                page += 1;
              }

              const title = `${this.getTitle(this.store.title)}.pdf`;
              doc.save(title);
              this.pdfLoading = false;
            })
            .catch((e) => {
              console.error("PDF 生成失败：", e);
              this.pdfLoading = false;
            });
          },
        },
      };
    };
  </script>
</template>
