<!-- layout-page.html -->
<template page>
  <link rel="stylesheet" href="./css/uno.css?v=0.2.8" />

  <l-m src="./component/l-menu.html"></l-m>
  <l-m src="./component/l-header.html"></l-m>

  <div class="flex flex-col h100vh relative">
    <l-header></l-header>
    <div class="flex-1 wfull flex relative flex-shrink-0 overflow-hidden">
      <x-if :value="sysStore.loading">
        <div
          class="absolute z999 bg-#00000009 top-0 left-0 wfull hfull flex-center"
        >
          <i class="i-eos-icons:bubble-loading w60px h60px text-#3498db"></i>
        </div>
      </x-if>
      <l-menu class="relative hfull"></l-menu>
      <main
        class="relative hfull wfull bg-theme-bg b-l b-l-solid b-l-theme-hover"
      >
        <slot></slot>
      </main>
    </div>
  </div>

  <script type="module">
    export default async ({ load }) => {
      const { sysStore, refreshTheme, system } = await load(
        "./store/system.js"
      );
      return {
        data: {
          currentPage: "",
          sysStore: {},
        },
        attached() {
          this.sysStore = sysStore;
          this.darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
          this.darkModeHandler = ({ matches }) => {
            if (this.sysStore.theme === system) {
              refreshTheme();
            }
          };
          this.darkModeQuery.addEventListener("change", this.darkModeHandler);
        },
        detached() {
          this.darkModeQuery?.removeEventListener("change", this.darkModeHandler);
          this.darkModeQuery = null;
          this.darkModeHandler = null;
          this.sysStore = null;
        },
        proto: {},
      };
    };
  </script>
</template>
