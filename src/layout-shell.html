<!-- layout-shell.html 壳布局：header + 全局 loading + 应用宿主；hash 路由由壳自身解析 -->
<template page>
  <link rel="stylesheet" href="./css/uno.css?v=0.5.0" />

  <l-m src="./component/l-header.html"></l-m>
  <l-m src="./micro/app-host.html"></l-m>

  <div class="flex flex-col h100vh relative">
    <l-header></l-header>
    <div class="flex-1 wfull flex relative flex-shrink-0 overflow-hidden">
      <x-if :value="sysStore.loading">
        <div
          class="absolute z999 bg-#00000009 top-0 left-0 wfull hfull flex-center"
        >
          <i class="i-eos-icons:bubble-loading w60px h60px text-#3498db"></i>
        </div>
      </x-if>
      <main class="relative hfull wfull bg-theme-bg">
        <x-if :value="routeName">
          <app-host :name="routeName" :sub="routeSub"></app-host>
        </x-if>
      </main>
    </div>
  </div>

  <script type="module">
    export default async ({ load }) => {
      const { sysStore, watchSystemTheme } = await load("./store/system.js");
      const { parseHash, toHash, DEFAULT_APP } = await load("./micro/router.js");

      return {
        data: {
          sysStore: {},
          routeName: "",
          routeSub: "",
        },
        attached() {
          this.sysStore = sysStore;
          this.offTheme = watchSystemTheme();
          this.onHash = () => this.syncHash();
          window.addEventListener("hashchange", this.onHash);
          this.syncHash();
        },
        detached() {
          window.removeEventListener("hashchange", this.onHash);
          this.offTheme?.();
          this.offTheme = null;
          this.sysStore = null;
        },
        proto: {
          /** 解析 hash → 归一化旧链接 → 更新当前应用（无 hash 时补默认应用） */
          syncHash() {
            let route = parseHash(location.hash);
            if (route.legacy || !location.hash || location.hash === "#") {
              const next = toHash({
                name: route.name || DEFAULT_APP,
                sub: route.sub,
              });
              history.replaceState(history.state, "", next);
              route = parseHash(next);
            }
            this.routeName = route.name;
            this.routeSub = route.sub;
            sysStore.activeApp = route.name;
          },
        },
      };
    };
  </script>
</template>
