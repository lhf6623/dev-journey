<template page>
  <link rel="stylesheet" href="../css/uno.css?v=0.2.8" />

  <div class="relative hfull overflow-y-auto bg-theme-bg">
    <!-- 切走瞬间 menus 会变回字符串数组，documentType 守卫防止对象模板渲染字符串报错 -->
    <x-if :value="sysStore.documentType === 'projects'">
      <x-if :value="sysStore.menus?.length">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x20px gap-y24px p24px max-w1400px mxauto"
        >
          <x-fill :value="sysStore.menus">
            <a
              attr:href="$host.getProjectUrl($data.name)"
              class="b b-theme-border b-solid rounded-8px overflow-hidden flex flex-col bg-theme-bg no-underline transition-all hover:shadow-lg hover:translate-y-[-4px]"
            >
              <!-- 有封面 -->
              <x-if :value="$data.cover">
                <img
                  attr:src="$host.getProjectUrl($data.name, $data.cover)"
                  :alt="$data.title"
                  loading="lazy"
                  class="wfull aspect-16/10 [object-fit:cover] bg-theme-hover"
                />
              </x-if>
              <!-- 无封面：渐变占位，显示标题首字（presetMini v66 无渐变规则，用任意值） -->
              <x-if :value="!$data.cover">
                <div
                  class="wfull aspect-16/10 flex-center text-40px text-white font700 bg-[linear-gradient(to_bottom_right,#4f8cf7,#8b5cf6)]"
                >
                  {{$data.title[0]}}
                </div>
              </x-if>
              <div class="p12px pt10px flex-1 flex flex-col gap-y4px">
                <p class="m0 truncate text-16px font600 text-theme-text">
                  {{$data.title}}
                </p>
                <p class="m0 line-clamp-2 text-12px text-blueGray">
                  {{$data.description}}
                </p>
              </div>
            </a>
          </x-fill>
        </div>
      </x-if>
      <!-- 空态提示 -->
      <x-if :value="!sysStore.menus?.length">
        <div class="hfull flex-center text-14px text-blueGray">
          暂无项目，在 projects/ 下新建目录并运行 pnpm menu
        </div>
      </x-if>
    </x-if>
  </div>

  <script>
    export default async ({ load }) => {
      const { sysStore, changeType, projects } = await load(
        "../store/system.js"
      );
      const { getUrl } = await load("../js/util.js");
      return {
        parent: "../layout-projects.html",
        data: {
          sysStore: {},
        },
        attached() {
          changeType(projects);
          this.sysStore = sysStore;
        },
        detached() {
          this.sysStore = null;
        },
        proto: {
          /** 拼项目资源地址：本地与 GitHub Pages 由 getUrl 统一处理 */
          getProjectUrl(name, file) {
            return getUrl(`projects/${name}/${file || "index.html"}`);
          },
        },
      };
    };
  </script>
</template>
