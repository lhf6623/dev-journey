<template component>
  <l-m src="./l-search.html"></l-m>
  <l-m src="./common/l-button.html"></l-m>
  <l-m src="./common/l-select.html"></l-m>

  <header
    class="z10 relative h50px !px18px flex-shrink-0 b-b b-theme-hover flex-center"
  >
    <x-if :value="sysStore.isSmall">
      <l-button
        :icon="'i-typcn:th-menu'"
        on:on-click="setMenu"
        :size="'large'"
        :icon-size="24"
      >
      </l-button>
    </x-if>
    <div
      class="flex-center ml3px *:bg-transparent *:px10px *:py3px *:whitespace-nowrap *:text-12px"
    >
      <button
        attr:class="`b b-solid b-theme-border rounded-s-full l-btn ${sysStore.documentType === 'leetcode' ? 'text-#0173ff':''}`"
        on:click="toPage('leetcode')"
      >
        力扣
      </button>
      <button
        attr:class="`b b-solid b-theme-border b-l-0px rounded-e-full l-btn ${sysStore.documentType === 'mdbook' ? 'text-#0173ff':''}`"
        on:click="toPage('mdbook')"
      >
        文档
      </button>
      <span class="text-blueGray">
        共【{{sysStore.menus?.length || 0}}】篇
      </span>
    </div>
    <nav class="hfull wfull flex items-center justify-end">
      <ul class="hfull gap-x8px m0 flex-center">
        <li>
          <l-search></l-search>
        </li>
        <li>
          <l-select :options="themeList" on:select="toggleTheme">
            <l-button :icon="getThemeIcon()" :icon-size="24">主题</l-button>
          </l-select>
        </li>
        <li>
          <a
            class="rounded-full overflow-hidden flex-center h24px w24px"
            target="_blank"
            tabindex="0"
            href="https://github.com/lhf6623/dev-journey"
          >
            <i
              class="i-mdi:github !h24px !w24px flex-shrink-0 inline-block"
            ></i>
          </a>
        </li>
        <li>
          <a
            class="rounded-full overflow-hidden flex-center h24px w24px"
            target="_blank"
            tabindex="0"
            href="https://leetcode.cn/u/lhf6623/"
          >
            <i
              class="i-tabler:brand-leetcode !h24px !w24px flex-shrink-0 inline-block"
            ></i>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <script type="module">
    import { getUrl } from "../js/util.js";
    export const tag = "l-header";
    export default async function ({ load }) {
      const { sysStore, refreshTheme, system, light, dark } = await load(
        "../store/system.js"
      );
      return {
        data: {
          sysStore: {},
          themeList: [
            {
              label: "系统",
              value: system,
              icon: "i-fluent-mdl2:system",
            },
            {
              label: "浅色",
              value: light,
              icon: "i-ph:sun-fill",
            },
            {
              label: "深色",
              value: dark,
              icon: "i-mage:moon-fill",
            },
          ],
        },
        attached() {
          this.sysStore = sysStore;
        },
        detached() {
          this.sysStore = null;
        },
        proto: {
          toPage(type) {
            if (this.sysStore.documentType === type) return;
            this.app.goto(getUrl(`src/pages/${type}.html`));
          },
          setMenu() {
            const { isShowMenu } = this.sysStore;
            this.sysStore.isShowMenu = !isShowMenu;
          },
          toggleTheme({ data }) {
            refreshTheme(data);
          },
          getThemeIcon() {
            if (!this.sysStore) return "";
            return (
              this.themeList.find((item) => item.value === this.sysStore.theme)
                ?.icon || ""
            );
          },
        },
      };
    }
  </script>
</template>
