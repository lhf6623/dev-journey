<template component>
  <l-m src="./common/l-button.html"></l-m>
  <l-m src="./common/l-select.html"></l-m>

  <header
    class="z10 relative h50px !px18px flex-shrink-0 b-b b-theme-hover flex-center"
  >
    <div
      class="flex-center *:bg-transparent *:px10px *:py3px *:whitespace-nowrap *:text-12px"
    >
      <!-- 应用 tab：由 src/micro/apps.json 清单驱动 -->
      <x-fill :value="apps">
        <button
          attr:class="`b b-solid b-theme-border l-btn ${$index === 0 ? 'rounded-s-full' : 'b-l-0px'} ${$index === $host.apps.length - 1 ? 'rounded-e-full' : ''} ${$host.isActive($data.name) ? 'text-#0173ff' : ''}`"
          on:click="$host.toPage($data.name)"
        >
          {{$data.title}}
        </button>
      </x-fill>
    </div>
    <nav class="hfull wfull flex items-center justify-end">
      <ul class="hfull gap-x8px m0 flex-center">
        <li>
          <l-select :options="themeList" on:select="toggleTheme">
            <l-button :icon="getThemeIcon()" :icon-size="24">主题</l-button>
          </l-select>
        </li>
        <li>
          <a
            class="rounded-full overflow-hidden flex-center h24px w24px"
            target="_blank"
            tabindex="0"
            href="https://github.com/lhf6623/dev-journey"
          >
            <i
              class="i-mdi:github !h24px !w24px flex-shrink-0 inline-block"
            ></i>
          </a>
        </li>
        <li>
          <a
            class="rounded-full overflow-hidden flex-center h24px w24px"
            target="_blank"
            tabindex="0"
            href="https://leetcode.cn/u/lhf6623/"
          >
            <i
              class="i-tabler:brand-leetcode !h24px !w24px flex-shrink-0 inline-block"
            ></i>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <script type="module">
    import { getUrl } from "../js/util.js";
    import { getApps } from "../micro/index.js";
    export const tag = "l-header";
    export default async function ({ load }) {
      const { sysStore, refreshTheme, system, light, dark } = await load(
        "../store/system.js"
      );
      return {
        data: {
          sysStore: {},
          apps: getApps(),
          themeList: [
            {
              label: "系统",
              value: system,
              icon: "i-fluent-mdl2:system",
            },
            {
              label: "浅色",
              value: light,
              icon: "i-ph:sun-fill",
            },
            {
              label: "深色",
              value: dark,
              icon: "i-mage:moon-fill",
            },
          ],
        },
        attached() {
          this.sysStore = sysStore;
        },
        detached() {
          this.sysStore = null;
        },
        proto: {
          /** tab 高亮：别名页 attached 时设置 sysStore.activeApp */
          isActive(name) {
            return this.sysStore?.activeApp === name;
          },
          toPage(name) {
            if (this.sysStore?.activeApp === name) return;
            // 物理别名页路由：#/app/<name>/（目录索引 + ofa 尾斜杠 .html flag）
            this.app.goto(getUrl(`app/${name}/`));
          },
          toggleTheme({ data }) {
            refreshTheme(data);
          },
          getThemeIcon() {
            if (!this.sysStore) return "";
            return (
              this.themeList.find((item) => item.value === this.sysStore.theme)
                ?.icon || ""
            );
          },
        },
      };
    }
  </script>
</template>
