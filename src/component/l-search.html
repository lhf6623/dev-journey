<template component>
  <input
    attr:placeholder="`搜索 ${sysStore.isMac ? '⌘':'Ctrl'} K`"
    list="menus"
    :value="inputValue"
    on:change="toggle"
    type="search"
    class="relative w168px box-border px6px py0px rounded placeholder:text-12px b b-solid b-theme-border"
  />
  <datalist id="menus">
    <x-fill :value="sysStore.menus">
      <option :value="$host.changeText($data)" />
    </x-fill>
  </datalist>
  <script type="module">
    export const tag = "l-search";
    import { keyboard } from "../js/Keyboard.mjs";
    export default async function ({ load }) {
      const { sysStore, mdbook, leetcode, handleFileSuffix, setSysTitle } =
        await load("../store/system.js");
      return {
        data: {
          sysStore: {},
          inputValue: "",
        },
        attached() {
          this.sysStore = sysStore;
          keyboard.on("Ctrl-K", this.focusInput, this);
        },
        detached() {
          this.sysStore = null;
          keyboard.off("Ctrl-K", this.focusInput, this);
        },
        proto: {
          // 监听按键 聚焦输入框
          focusInput() {
            this.shadow.ele.querySelector("input").focus();
          },
          changeText: handleFileSuffix,
          async toggle(e) {
            const _title = e.target.value.trim();
            if (!_title) return;
            const suffix =
              this.sysStore.documentType == mdbook ? ".md" : ".js";

            // 支持带完整后缀（.js/.md）输入命中：已带后缀则直接匹配，否则补全
            const target = _title.endsWith(suffix) ? _title : `${_title}${suffix}`;

            const inMenu = this.sysStore.menus.reduce((pre, curr) => {
              if (pre === true) return pre;
              return curr === target;
            }, false);

            if (!inMenu) return;

            this.inputValue = e.target.value;
            this.inputValue = "";
            setSysTitle(target);
          },
        },
      };
    }
  </script>
</template>
