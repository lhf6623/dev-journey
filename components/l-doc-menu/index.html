<!-- l-doc-menu.html 文档菜单（通用组件：menus/title 由宿主 props 驱动，合并自 leetcode-menu/mdbook-menu） -->
<template component>
  <div
    on:click="setMenu"
    attr:class="`${isSmall && isShowMenu ? 'op100 z300' : 'op0 !z--1'} bg-#00000022 transition-all fixed w100vw h100vh top-0 left-0`"
  ></div>
  <x-if :value="isSmall">
    <button
      on:click="showMenu"
      class="fixed bottom-20px left-16px z400 b b-solid b-theme-border rounded-full w40px h40px flex-center bg-theme-bg"
      aria-label="打开菜单"
    >
      <i class="i-typcn:th-menu"></i>
    </button>
  </x-if>
  <aside
    attr:class="`${menuClass} hfull transition-all w280px text-theme-text bg-theme-bg overflow-y-auto relative flex-shrink-0 z1`"
  >
    <ul class="p0 m0 relative px16px">
      <x-fill :value="menus">
        <li
          attr:class="`${$host.title === $data ? 'text-#0173ff active bg-theme-hover' : ''} l-btn rounded-5px font500 truncate pl8px py2px my5px mx0px text-ellipsis text-16px`"
          on:click="$host.toggle($data)"
          on:keydown="$host.keydownToggle($event, $data)"
          attr:title="$host.stripSuffix($data)"
          tabindex="0"
        >
          {{$host.stripSuffix($data)}}
        </li>
      </x-fill>
    </ul>
  </aside>
  <script type="module">
    export const tag = "l-doc-menu";
    import { throttle } from "../_shared/throttle.mjs";

    /** 视口小于该宽度时菜单收起为悬浮按钮 */
    const SMALL_WIDTH = 960;

    export default async function () {
      return {
        attrs: {},
        data: {
          menus: [],
          title: "",
          isSmall: false,
          isShowMenu: true,
          menuClass: "",
        },
        attached() {
          // 用箭头函数包一层：addEventListener 回调里的 this 是 window，
          // 直接把 setShowMenu 交给 throttle 会把状态写到 window 上，resize 不生效
          this.resizeHandler = throttle(() => this.setShowMenu(), 300);
          window.addEventListener("resize", this.resizeHandler);
          this.setShowMenu();
        },
        detached() {
          window.removeEventListener("resize", this.resizeHandler);
          this.resizeHandler = null;
        },
        proto: {
          /** 宽屏常驻；窄屏按 isShowMenu 展开或收起 */
          syncMenuClass() {
            if (!this.isSmall) {
              this.menuClass = "";
              return;
            }
            this.menuClass = this.isShowMenu
              ? "!fixed z400 !top-0 !h100vh"
              : "!fixed !w0 overflow-hidden";
          },
          setShowMenu() {
            const width = window.innerWidth;
            this.isSmall = width < SMALL_WIDTH;
            this.isShowMenu = width >= SMALL_WIDTH;
            this.syncMenuClass();
          },
          showMenu() {
            this.isShowMenu = true;
            this.syncMenuClass();
          },
          /** 收起菜单（遮罩点击、选中菜单项后调用） */
          setMenu() {
            this.isShowMenu = false;
            this.syncMenuClass();
          },
          stripSuffix(textName) {
            return typeof textName === "string"
              ? textName.replace(/\.\w+$/, "")
              : "";
          },
          keydownToggle(e, _title) {
            if (e.key === "Enter") {
              this.toggle(_title);
            }
          },
          toggle(_title) {
            this.setMenu();
            setTimeout(() => this.emit("toggle", { data: _title }), 0);
          },
        },
      };
    }
  </script>
</template>
