<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 首屏引导（同步套主题 + 加载动画）：逻辑在 src/styles/boot.js，改一处即可 -->
    <script src="../../src/styles/boot.js?v=0.6.0"></script>
    <title>l-button demo</title>
    <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.6.12/dist/ofa.min.js"></script>
    <script type="module">
      // 组件库暂时复用站点的公共样式加载器（将来抽仓时把 src/styles 复制一份到 components/）
      import { installCommonStyles } from "../../src/styles/index.js";
      installCommonStyles();
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text p24px">
    <h1 class="text-18px">l-button 独立 demo</h1>
    <div class="flex items-center gap-x12px">
      <l-m src="./index.html"></l-m>
      <l-button :icon="'i-mdi:github'">默认按钮</l-button>
      <l-button :icon="'i-tabler:pdf'" :loading="true">加载中</l-button>
      <l-button :icon="'i-mdi:plus'" :size="'large'">Large</l-button>
    </div>
  </body>
</html>
